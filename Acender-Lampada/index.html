<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lampada</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>

<body>

<header>
    <img id="logo" src="img/assets/logo.png" alt="logo do site">
    <p id="texto-logo">Acender <span>Lâmpada</span></p>
</header>


<main> <!-- Conteúdo principal da página -->

    <section class="apresentacao"> <!-- Seção de apresentação -->

        <p class="subtitulo">EXERCÍCIO PRÁTICO</p> <!-- Identificação do exercício -->

        <h1> <!-- Título principal -->
            Acenda a <span>Lâmpada</span> <!-- Span permite destacar a palavra com CSS -->
        </h1> <!-- Fim do título -->

        <p class="descricao"> <!-- Descrição do exercício -->
            Use JavaScript para controlar
            o estado da lâmpada.
        </p> <!-- Fim da descrição -->

    </section> <!-- Fim da seção de apresentação -->
    
    
<section class="area-lampada"> <!-- Área responsável pela imagem da lâmpada -->

    <img src="img/lâmpada/apagada.png" alt="Lâmpada apagada" id="imagem-lampada"> <!-- Imagem inicial da lâmpada -->
    
<div class="controle-lampada"> <!-- Agrupa os ícones e o interruptor -->

    <img src="img/assets/icone-apagada.png" alt="Desligada" class="icone-estado"> <!-- Ícone da lâmpada apagada -->

    <button type="button" id="interruptor" aria-label="Acender lâmpada" aria-pressed="false"></button> <!-- Botão que controlará a lâmpada -->

    <img src="img/assets/icone-acesa.png" alt="Ligada" class="icone-estado"> <!-- Ícone da lâmpada acesa -->

</div> <!-- Fim do controle -->

</section> <!-- Fim da área da lâmpada -->


</main> <!-- Fim do conteúdo principal -->





    <script src="js/script.js"></script>
</body>
</html>
